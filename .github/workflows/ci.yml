name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    name: Build and Test Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # NuGet.config contains artifacts/nuget as a local source.
      - name: Prepare local NuGet source
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts/nuget | Out-Null

      - name: Restore
        run: dotnet restore Majo.TerminalUI.slnx -p:UsePackageReference=false

      - name: Build
        run: dotnet build Majo.TerminalUI.slnx -c Release --no-restore -p:UsePackageReference=false

      - name: Test
        run: dotnet test Majo.TerminalUI.AutoTest/Majo.TerminalUI.AutoTest.csproj -c Release --no-build --no-restore -p:UsePackageReference=false

  test-linux:
    name: Build and Test Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # NuGet.config contains artifacts/nuget as a local source.
      - name: Prepare local NuGet source
        run: mkdir -p artifacts/nuget

      - name: Restore
        run: dotnet restore Majo.TerminalUI.slnx -p:UsePackageReference=false

      - name: Build
        run: dotnet build Majo.TerminalUI.slnx -c Release --no-restore -p:UsePackageReference=false

      - name: Test
        run: dotnet test Majo.TerminalUI.AutoTest/Majo.TerminalUI.AutoTest.csproj -c Release --no-build --no-restore -p:UsePackageReference=false

  package:
    name: Pack and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Prepare local NuGet source
        run: mkdir -p artifacts/nuget

      - name: Restore
        run: dotnet restore Majo.TerminalUI.slnx -p:UsePackageReference=false

      - name: Build
        run: dotnet build Majo.TerminalUI.slnx -c Release --no-restore -p:UsePackageReference=false

      - name: Pack
        run: dotnet pack Majo.TerminalUI/Majo.TerminalUI.csproj -c Release --no-build

      - name: Validate NuGet package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_FILE="$(find artifacts/nuget -maxdepth 1 -type f -name 'Majo.TerminalUI.*.nupkg' | head -n 1)"
          SYMBOL_FILE="$(find artifacts/nuget -maxdepth 1 -type f -name 'Majo.TerminalUI.*.snupkg' | head -n 1)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "Majo.TerminalUI .nupkg was not generated."
            exit 1
          fi

          if [ -z "$SYMBOL_FILE" ]; then
            echo "Majo.TerminalUI .snupkg was not generated."
            exit 1
          fi

          unzip -l "$PACKAGE_FILE" > package-contents.txt

          grep -Fq "lib/net8.0/Majo.TerminalUI.dll" package-contents.txt
          grep -Fq "lib/net10.0/Majo.TerminalUI.dll" package-contents.txt
          grep -Fq "buildTransitive/Majo.TerminalUI.targets" package-contents.txt
          grep -Fq "README.nuget.md" package-contents.txt
          grep -Fq "LICENSE.txt" package-contents.txt

          if grep -Fq "libmajo_line_editor.so" package-contents.txt; then
            echo "Majo.TerminalUI must not embed Majo.LineEditing native runtime assets."
            exit 1
          fi

      - name: Restore AutoTest from local NuGet package
        run: >
          dotnet restore
          Majo.TerminalUI.AutoTest/Majo.TerminalUI.AutoTest.csproj
          -p:UsePackageReference=true
          --force

      - name: Test AutoTest from local NuGet package
        run: >
          dotnet test
          Majo.TerminalUI.AutoTest/Majo.TerminalUI.AutoTest.csproj
          -c Release
          --no-restore
          -p:UsePackageReference=true

      - name: Publish Windows package consumer
        run: >
          dotnet publish
          Majo.TerminalUI.AutoTest/Majo.TerminalUI.AutoTest.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:UsePackageReference=true
          -o artifacts/publish/win-x64

      - name: Publish Linux package consumer
        run: >
          dotnet publish
          Majo.TerminalUI.AutoTest/Majo.TerminalUI.AutoTest.csproj
          -c Release
          -r linux-x64
          --self-contained false
          -p:UsePackageReference=true
          -o artifacts/publish/linux-x64

      - name: Validate transitive runtime assets
        shell: bash
        run: |
          set -euo pipefail

          test -f artifacts/publish/win-x64/Majo.TerminalUI.dll
          test -f artifacts/publish/win-x64/Wcwidth.dll
          test ! -f artifacts/publish/win-x64/libmajo_line_editor.so

          test -f artifacts/publish/linux-x64/Majo.TerminalUI.dll
          test -f artifacts/publish/linux-x64/Wcwidth.dll
          test -f artifacts/publish/linux-x64/libmajo_line_editor.so

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: Majo.TerminalUI-NuGet
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

      - name: Upload published consumers
        uses: actions/upload-artifact@v7
        with:
          name: Majo.TerminalUI-Publish
          path: artifacts/publish/
          if-no-files-found: error
